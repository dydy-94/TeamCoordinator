spring:
  application:
    name: TeamCoordinator
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  profiles:
    default: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/xservice?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  flyway:
    # 默认关闭：数据库由 db/init/*.sql 初始化（compose 挂载自动执行）。
    # 需要走 Flyway 迁移时设 FLYWAY_ENABLED=true。
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

digital-team:
  prompt:
    admin-users: ${PROMPT_ADMIN_USERS:root}
  rollout:
    enabled: ${DIGITAL_TEAM_MVP_ENABLED:true}
    emergency-stop: ${DIGITAL_TEAM_EMERGENCY_STOP:false}
  execution:
    worker-interval-ms: ${EXECUTION_WORKER_INTERVAL_MS:500}
    agentcore-failure-threshold: ${AGENTCORE_FAILURE_THRESHOLD:60}
  events:
    database-poll-interval-ms: ${EVENT_DATABASE_POLL_INTERVAL_MS:500}
    heartbeat-interval-ms: ${EVENT_HEARTBEAT_INTERVAL_MS:60000}
    inactivity-timeout-min: ${EVENT_INACTIVITY_TIMEOUT_MIN:30}
  agent-core:
    mock-enabled: ${AGENTCORE_MOCK_ENABLED:true}
    coordinator-agent-id: ${COORDINATOR_AGENT_ID:coordinator}
    session-header: ${AGENTCORE_SESSION_HEADER:X-Session-Id}
    base-url: ${AGENTCORE_BASE_URL:}
    submit-path: ${AGENTCORE_SUBMIT_PATH:/{agentId}/chat}
    status-path: ${AGENTCORE_STATUS_PATH:/{agentId}/sessions/{sessionId}}
    stream-path: ${AGENTCORE_STREAM_PATH:/{agentId}/sessions/{sessionId}/stream}
    cancel-path: ${AGENTCORE_CANCEL_PATH:/{agentId}/sessions/{sessionId}/cancel}
    auth-header: ${AGENTCORE_AUTH_HEADER:Authorization}
    auth-value: ${AGENTCORE_AUTH_VALUE:}
    artifact-tool-token: ${AGENTCORE_ARTIFACT_TOOL_TOKEN:}
  storage:
    type: ${STORAGE_TYPE:minio}
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:digital-team}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level trace_id=%X{trace_id:-} project_id=%X{project_id:-} thread=%thread logger=%logger{36} message=%msg%n"
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
